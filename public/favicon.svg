<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Core luminous gradient -->
    <radialGradient id="sunCore" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="30%" stop-color="#ffb834" />
      <stop offset="70%" stop-color="#ff7b1a" />
      <stop offset="100%" stop-color="#d94100" />
    </radialGradient>
    
    <!-- Ray gradient -->
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd066" />
      <stop offset="100%" stop-color="#ff7a1a" />
    </linearGradient>

    <!-- Outer corona glow filter -->
    <filter id="solarGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff6b00" flood-opacity="0.75" />
    </filter>
  </defs>

  <g filter="url(#solarGlow)">
    <!-- Cardinal rays -->
    <rect x="29" y="3" width="6" height="10" rx="3" fill="url(#sunRay)" />
    <rect x="29" y="51" width="6" height="10" rx="3" fill="url(#sunRay)" />
    <rect x="3" y="29" width="10" height="6" rx="3" fill="url(#sunRay)" />
    <rect x="51" y="29" width="10" height="6" rx="3" fill="url(#sunRay)" />

    <!-- Intercardinal diagonal rays (rotated 45deg) -->
    <g transform="rotate(45 32 32)">
      <rect x="29" y="4.5" width="6" height="8.5" rx="3" fill="url(#sunRay)" />
      <rect x="29" y="51" width="6" height="8.5" rx="3" fill="url(#sunRay)" />
      <rect x="4.5" y="29" width="8.5" height="6" rx="3" fill="url(#sunRay)" />
      <rect x="51" y="29" width="8.5" height="6" rx="3" fill="url(#sunRay)" />
    </g>

    <!-- Sun Core Sphere -->
    <circle cx="32" cy="32" r="17.5" fill="url(#sunCore)" />
  </g>
</svg>
