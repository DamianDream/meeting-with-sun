<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting With Sun</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --fg: #f8fafc;
      --accent: #f59e0b;
      --muted: #94a3b8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --accent: #d97706;
        --muted: #64748b;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--fg);
      text-align: center;
      padding: 2rem;
    }
    .sun-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 1.5rem;
      border-radius: 50%;
      background: radial-gradient(circle, #fbbf24 0%, #f59e0b 70%, #d97706 100%);
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 25px rgba(245, 158, 11, 0.3); }
      100% { transform: scale(1.05); box-shadow: 0 0 50px rgba(245, 158, 11, 0.6); }
    }
    h1 {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1.25rem;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="sun-icon"></div>
  <h1>Meeting With Sun</h1>
  <p>Website is under active development. Coming soon.</p>
</body>
</html>
